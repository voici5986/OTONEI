<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 添加屏幕方向锁定，强制竖屏 -->
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="msapplication-orientation" content="portrait" />
    <!-- 与 theme.css 的 --color-background-alt 保持一致，改令牌时同步这里与 vite.config.mjs -->
    <meta name="theme-color" content="#f7f7f5" />
    <meta
      name="description"
      content="OTONEI音乐播放器 - 在线音乐搜索、播放、下载，支持多平台音乐资源"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OTONEI" />
    <title>OTONEI - 跨平台音乐播放器</title>

    <!-- PWA启动屏幕样式 -->
    <style>
      /* PWA启动屏幕样式 */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        /* 与 theme-color / --color-background-alt 保持一致，避免启动屏与状态栏出现色差 */
        background: #f7f7f5;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s;
      }

      .splash-container {
        text-align: center;
      }

      .splash-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.7;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0.95);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <!-- PWA启动屏幕 -->
    <div id="splash-screen">
      <div class="splash-container">
        <img src="/logo.svg" class="splash-logo" alt="OTONEI" />
        <h2 style="color: #000000; font-family: 'MiSans', sans-serif; margin: 0; font-weight: 600">
          OTONEI
        </h2>
      </div>
    </div>

    <script src="/splash.js" defer></script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
