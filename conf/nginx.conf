server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    include /etc/nginx/otonei-security-headers.conf;

    location / {
        root   /usr/share/nginx/html;
        include /etc/nginx/otonei-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/otonei-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /MiSansVF.woff2 {
        root /usr/share/nginx/html;
        include /etc/nginx/otonei-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location = /api-v1 {
        include /etc/nginx/otonei-security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_ssl_server_name on;
        proxy_set_header Host music-api.gdstudio.xyz;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_pass https://music-api.gdstudio.xyz/api.php;
    }

    location = /api-v1/ {
        include /etc/nginx/otonei-security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_ssl_server_name on;
        proxy_set_header Host music-api.gdstudio.xyz;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_pass https://music-api.gdstudio.xyz/api.php;
    }

    location = /api-v1/api.php {
        include /etc/nginx/otonei-security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_ssl_server_name on;
        proxy_set_header Host music-api.gdstudio.xyz;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_pass https://music-api.gdstudio.xyz/api.php;
    }

    location /api-v1/ {
        default_type application/json;
        return 404 '{"error":"Not Found","message":"Unsupported API proxy path"}';
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
