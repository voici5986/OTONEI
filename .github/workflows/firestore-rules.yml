name: Firestore Rules

on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - scripts/test-firestore-rules.mjs
      - .github/workflows/firestore-rules.yml
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - scripts/test-firestore-rules.mjs
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: '15.30.0'
  FIREBASE_RULES_TESTING_VERSION: '5.0.2'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Firestore rules behavior test dependencies
        run: >-
          npm install --no-save --no-package-lock --ignore-scripts
          "@firebase/rules-unit-testing@${FIREBASE_RULES_TESTING_VERSION}"
          "firebase@12.19.0"

      # 模拟器启动同时覆盖规则语法，脚本再覆盖关键 allow/deny 场景。
      - name: Test Firestore rules behavior
        run: >-
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          emulators:exec --only firestore
          "node scripts/test-firestore-rules.mjs"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Skip deploy when Firebase credentials are missing
        if: env.FIREBASE_PROJECT_ID == '' || env.FIREBASE_TOKEN == ''
        run: echo "Firebase credentials are not configured; skipping Firestore rules deployment."

      - name: Deploy Firestore rules
        if: env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_TOKEN != ''
        run: >-
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          deploy --only firestore:rules
          --project "$FIREBASE_PROJECT_ID"
          --token "$FIREBASE_TOKEN"
          --non-interactive
