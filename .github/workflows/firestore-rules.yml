name: Firestore Rules

on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - scripts/test-firestore-rules.mjs
      - .github/workflows/firestore-rules.yml
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - scripts/test-firestore-rules.mjs
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: '15.34.1'
  FIREBASE_RULES_TESTING_VERSION: '6.0.0'
  # 必须与 package.json#dependencies.firebase 解析出的大版本一致：
  # @firebase/rules-unit-testing 的 peer 会按 firebase 大版本卡死，
  # 这里独立 npm install，不与 pnpm-lock.yaml 联动，升 firebase 时要同步改。
  FIREBASE_SDK_VERSION: '13.1.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # @firebase/rules-unit-testing@6 要求 node >= 24.12。取 .node-version，
          # 与 deploy job、项目 engines (>=26 <27) 共用同一个版本来源
          node-version-file: .node-version

      - name: Install Firestore rules behavior test dependencies
        run: >-
          npm install --no-save --no-package-lock --ignore-scripts
          "@firebase/rules-unit-testing@${FIREBASE_RULES_TESTING_VERSION}"
          "firebase@${FIREBASE_SDK_VERSION}"

      # 模拟器启动同时覆盖规则语法，脚本再覆盖关键 allow/deny 场景。
      - name: Test Firestore rules behavior
        run: >-
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          emulators:exec --only firestore
          "node scripts/test-firestore-rules.mjs"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 与 ci.yml / main.yml 一样取 .node-version，避免同一文件里两个 job
          # 各写一个版本号。main.yml 会断言 .node-version 匹配 ^26。
          node-version-file: .node-version

      - name: Skip deploy when Firebase credentials are missing
        if: env.FIREBASE_PROJECT_ID == '' || env.FIREBASE_TOKEN == ''
        run: echo "Firebase credentials are not configured; skipping Firestore rules deployment."

      - name: Deploy Firestore rules
        if: env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_TOKEN != ''
        run: >-
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          deploy --only firestore:rules
          --project "$FIREBASE_PROJECT_ID"
          --token "$FIREBASE_TOKEN"
          --non-interactive
